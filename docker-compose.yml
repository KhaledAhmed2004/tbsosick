services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tbsosick:latest
    container_name: tbsosick_api
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: "5003"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
