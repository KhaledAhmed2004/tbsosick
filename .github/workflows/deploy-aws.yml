name: Deploy Backend to EC2

on:
  push:
    branches: [main]

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e

            echo "=== Backend deployment started at $(date) ==="

            cd /var/www/backend2

            echo ">>> Pulling latest code..."
            sudo git pull origin main

            echo ">>> Deploying with Docker Compose..."
            sudo docker compose up -d --build

            echo ">>> Pruning old unused images to free up space..."
            sudo docker image prune -f

            sleep 15
            echo ">>> Health check..."
            curl -sf -o /dev/null -w "Backend HTTP Status: %{http_code}\n" https://api.smrtscrub.app/ || echo "WARNING: Backend health check failed"

            echo "=== Backend deployment completed at $(date) ==="
