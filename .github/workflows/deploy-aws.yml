name: Deploy Backend to EC2

on:
  push:
    branches: [main]

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 600s
          script: |
            set -e

            echo "=== Backend deployment started at $(date) ==="

            cd /var/www/backend2

            echo ">>> Pulling latest code..."
            sudo git pull origin main

            echo ">>> Building Docker Image..."
            sudo docker build -t tbsosick .

            echo ">>> Stopping old container if it exists..."
            sudo docker stop tbsosick_api || true
            sudo docker rm tbsosick_api || true

            echo ">>> Starting new container..."
            sudo docker run -d --name tbsosick_api --network host --env-file .env --restart unless-stopped -e PORT=5003 tbsosick

            echo ">>> Pruning old unused images to free up space..."
            sudo docker image prune -f

            sleep 5
            echo ">>> Health check..."
            curl -sf -o /dev/null -w "Backend HTTP Status: %{http_code}\n" https://api.smrtscrub.app/ || echo "WARNING: Backend health check failed"

            echo "=== Backend deployment completed at $(date) ==="
